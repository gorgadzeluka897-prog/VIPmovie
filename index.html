<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIPmovie</title>
<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
}
header{
    background:#e50914;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}
.movie{
    margin:30px auto;
    width:300px;
    background:#222;
    padding:15px;
    border-radius:10px;
}
img{
    width:100%;
    border-radius:10px;
}
button{
    background:#e50914;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>
<body>

<header>VIPmovie</header>

<div class="movie">
    <img src="https://via.placeholder.com/300x450" alt="Movie">
    <h2>ჩემი ფილმი</h2>
    <p>ფილმის აღწერა</p>
    <button>ნახვა</button>
</div>

</body>
</html>
